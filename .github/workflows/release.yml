name: Release

# Cut a release by pushing a tag: `git tag v0.1.0 && git push origin v0.1.0`.
# Each OS job builds the `tm` binary and attaches `tm-<target>.tar.gz` to the
# GitHub Release for that tag (created if missing, with generated notes).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p tm-cli --target ${{ matrix.target }}
      - name: Package the binary
        run: |
          STAGE="tm-${{ matrix.target }}"
          mkdir "$STAGE"
          cp "target/${{ matrix.target }}/release/tm" "$STAGE/"
          tar -czf "$STAGE.tar.gz" "$STAGE"
      - name: Publish to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: tm-${{ matrix.target }}.tar.gz
          generate_release_notes: true
