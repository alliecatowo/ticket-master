name: Release

# Cut a release by pushing a tag: `git tag v0.1.0 && git push origin v0.1.0`.
# Each OS job runs `scripts/release.sh` -- the exact same script `mise run release` runs locally
# -- so the tag-triggered asset and a locally-built one are produced by one code path, not two
# that can drift (dist/tm-<host-triple>.tar.gz + share/tm/web/ + README-INSTALL.md + .sha256,
# refusing to ship a `.env`/`.tm/` path) and are then attached to the GitHub Release for that tag
# (created if missing, with generated notes).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: clients/web/pnpm-lock.yaml
      # The runner's host triple always equals this job's `matrix.target` (each job runs on the
      # OS/arch it's cross-checking out for), so `scripts/release.sh`'s own `rustc -vV`-derived
      # triple lands on the same name this step's upload/asset naming expects.
      - name: Build and package via scripts/release.sh
        run: bash scripts/release.sh
      - name: Publish to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/tm-${{ matrix.target }}.tar.gz
            dist/tm-${{ matrix.target }}.tar.gz.sha256
          generate_release_notes: true

  # Homebrew formula in alliecatowo/homebrew-tap. Renders Formula/ticket-master.rb
  # from the per-target .sha256 files and pushes it over SSH with a write deploy
  # key (secret HOMEBREW_TAP_DEPLOY_KEY, no PAT). Skipped for pre-release tags.
  update-homebrew:
    name: Update Homebrew formula
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    permissions:
      contents: read
    steps:
      - name: Render and push Formula/ticket-master.rb
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_DEPLOY_KEY:-}" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY secret is not set; cannot update the tap"
            exit 1
          fi
          VERSION="${TAG_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}"
          mkdir assets
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --dir assets --pattern '*.sha256'
          sha() {
            local s
            s="$(cut -d' ' -f1 "assets/tm-$1.tar.gz.sha256")"
            if [ -z "$s" ]; then echo "::error::no checksum for tm-$1.tar.gz" >&2; exit 1; fi
            echo "$s"
          }
          MAC_ARM_SHA="$(sha aarch64-apple-darwin)"
          MAC_X86_SHA="$(sha x86_64-apple-darwin)"
          LINUX_ARM_SHA="$(sha aarch64-unknown-linux-gnu)"
          LINUX_X86_SHA="$(sha x86_64-unknown-linux-gnu)"

          cat > ticket-master.rb <<EOF
          # Homebrew formula for ticket-master (the tm CLI). Generated by the update-homebrew
          # job in alliecatowo/ticket-master (.github/workflows/release.yml) on each stable
          # release. Do not edit by hand.
          class TicketMaster < Formula
            desc "Interactive coding agent with a ticket-powered background crew (the tm CLI)"
            homepage "https://github.com/alliecatowo/ticket-master"
            version "${VERSION}"
            license any_of: ["MIT", "Apache-2.0"]

            on_macos do
              on_arm do
                url "${base}/tm-aarch64-apple-darwin.tar.gz"
                sha256 "${MAC_ARM_SHA}"
              end
              on_intel do
                url "${base}/tm-x86_64-apple-darwin.tar.gz"
                sha256 "${MAC_X86_SHA}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/tm-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_ARM_SHA}"
              end
              on_intel do
                url "${base}/tm-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_X86_SHA}"
              end
            end

            def install
              # The tarball holds one tm-<triple>/ directory: bin/tm plus share/tm/web
              # (the web client tm serve finds next to the binary).
              bin.install "bin/tm"
              (share/"tm").install "share/tm/web"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/tm --version")
            end
          end
          EOF

          install -d -m 700 ~/.ssh
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $keyfile -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone --depth 1 git@github.com:alliecatowo/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp ticket-master.rb tap/Formula/ticket-master.rb
          cd tap
          if [ -z "$(git status --porcelain)" ]; then
            echo "Tap already up to date; nothing to push."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ticket-master.rb
          git commit -m "ticket-master ${VERSION}"
          for _ in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
