[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alliecatowo/ticket-master"

[workspace.dependencies]
tm-types = { path = "crates/tm-types" }
tm-events = { path = "crates/tm-events" }
tm-core = { path = "crates/tm-core" }
tm-scheduler = { path = "crates/tm-scheduler" }
tm-provider = { path = "crates/tm-provider" }
tm-codeintel = { path = "crates/tm-codeintel" }
tm-context = { path = "crates/tm-context" }
tm-docs = { path = "crates/tm-docs" }
tm-harness = { path = "crates/tm-harness" }
tm-agent = { path = "crates/tm-agent" }
tm-genesis = { path = "crates/tm-genesis" }
tm-workflow = { path = "crates/tm-workflow" }
tm-mirror = { path = "crates/tm-mirror" }
tm-server = { path = "crates/tm-server" }
tm-tui = { path = "crates/tm-tui" }
tm-pty = { path = "crates/tm-pty" }
tm-templates = { path = "crates/tm-templates" }
tm-auth = { path = "crates/tm-auth" }
tm-acp = { path = "crates/tm-acp" }
tm-wiki = { path = "crates/tm-wiki" }
tm-mcp = { path = "crates/tm-mcp" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
rusqlite = { version = "0.37", features = ["bundled", "blob", "functions", "backup"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
regex = "1"
globset = "0.4"
ignore = "0.4"
git2 = { version = "0.20", default-features = false }
blake3 = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
rand = "0.9"
parking_lot = "0.12"
similar = "2"
dirs = "6"
dotenvy = "0.15"
futures = "0.3"
async-trait = "0.1"
tempfile = "3"
proptest = "1"
insta = { version = "1", features = ["json", "redactions"] }
assert_cmd = "2"
predicates = "3"
serial_test = "3"
# tm-tui: ratatui/ratatui-core own the cell buffer, diffing and the crossterm backend (D-002);
# everything above the buffer (components, focus, widgets, theming) is ours. ratatui-core is
# preferred directly wherever a file needs only Buffer/Rect/Style and not the widget set or a
# terminal backend, per D-002.
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "serde"] }
ratatui-core = { version = "0.1", default-features = false, features = ["std", "serde"] }
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"
portable-pty = "0.9"
# tm-tui test harness only: portable-pty hands back raw bytes, and PtyHarness::screen() needs a
# rendered grid. A hand-rolled subset parser would make the SIGTERM/SIGHUP/SIGTSTP tests it gates
# flaky in exactly the cases they exist to catch, so parse properly (D-002).
vt100 = "0.15"
# tm-server: renders wiki pages (SPEC.md §26.4, `GET /wiki/*`) from markdown to HTML. No markdown
# crate existed anywhere in the workspace; pulldown-cmark is the de facto minimal, pure-Rust,
# well-maintained CommonMark parser (no unsafe, no unbounded recursion by default), chosen over
# hand-rolling a parser in a server handler.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# Disk pressure on this 8GB/228GB-disk machine (see CLAUDE.md's disk:guard section): a dev build's
# debuginfo is most of target/'s size, and almost none of it is ours. Third-party crates never get
# breakpointed here, so they don't need debuginfo at all; our own crates keep line-table-only info,
# which is enough for a backtrace's file:line but not full lldb locals -- shrink further only if a
# specific debugging session needs it back, not as a standing default. This invalidates existing
# build caches once (fingerprints include profile settings), which is expected the first time this
# lands, not a bug.
[profile.dev.package."*"]
debug = false

[profile.dev]
debug = "line-tables-only"
