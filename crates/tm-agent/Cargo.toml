[package]
name = "tm-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The tool-using, authority-gated coding agent loop for Ticketmaster."

[dependencies]
tm-types = { workspace = true }
tm-core = { workspace = true }
tm-events = { workspace = true }
tm-provider = { workspace = true }
tm-codeintel = { workspace = true }
tm-context = { workspace = true }
tm-harness = { workspace = true }
# Not yet promoted to [workspace.dependencies] in the root manifest, matching how tm-cli already
# pulls these two in (docs/audit-2026-09-18-fable.md B-02: tm-agent finally depends on both so
# their CapabilityProvider impls are reachable by an agent, not just by a human running `tm
# browser`/`tm computer`).
tm-browser = { path = "../tm-browser" }
tm-computer = { path = "../tm-computer" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
similar = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }
toml = { workspace = true }

[features]
default = []
# Live, real-network Codex ChatGPT-subscription auth-loop proof (D-016), off by default: gates a
# single #[tokio::test] in src/agent_loop.rs's own tests module that drives a real AgentLoop turn
# through a real tm_provider::providers::codex_chatgpt::CodexChatGptProvider against the real
# chatgpt.com/backend-api/codex backend, using whatever real, already-logged-in Codex CLI session
# is present on this machine. No new dependency: tm-provider (already a direct dependency above)
# always compiles CodexChatGptProvider, unconditionally -- this feature exists purely to keep the
# *test* itself (the one thing here that touches the real network) out of every ordinary
# `cargo test`/`mise run verify` run, mirroring crates/tm-cli's `otel` feature (D-010). See
# `mise.toml`'s `test:live-codex-auth` task and
# docs/decisions/D-016-codex-chatgpt-session-auth-adapter.md.
live-codex-auth = []

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
