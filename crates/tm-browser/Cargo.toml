[package]
name = "tm-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ticketmaster Browser: no-friction headless browser control over the raw Chrome DevTools Protocol, with an accessibility-tree snapshot as the default agent-facing observation."

[dependencies]
tm-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
blake3 = { workspace = true }
async-trait = { workspace = true }
tokio-tungstenite = "0.30"
# `browser.toml` parsing (`config.rs`).
toml = "1"
# Chrome for Testing publishes SHA256 digests; `blake3` (above) is used for in-process content
# addressing elsewhere in this crate and does not match the vendor-published digest format.
sha2 = "0.11"
hex = "0.4"
