[package]
name = "tm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "tm: the Ticketmaster command-line surface — the interactive coding agent by default, every subcommand the rest of the workspace exposes, --json everywhere."

[[bin]]
name = "tm"
path = "src/main.rs"

[dependencies]
tm-types = { workspace = true }
tm-core = { workspace = true }
tm-events = { workspace = true }
tm-auth = { workspace = true }
async-trait = { workspace = true }
tm-scheduler = { workspace = true }
tm-provider = { workspace = true }
tm-codeintel = { workspace = true }
tm-context = { workspace = true }
tm-docs = { workspace = true }
tm-harness = { workspace = true }
tm-agent = { workspace = true }
tm-genesis = { workspace = true }
tm-workflow = { workspace = true }
tm-mirror = { workspace = true }
tm-server = { workspace = true }
tm-tui = { workspace = true }
tm-templates = { workspace = true }
tm-wiki = { workspace = true }
# Not yet promoted to [workspace.dependencies] in the root manifest; pathed directly so this
# crate does not require editing the workspace root.
tm-browser = { path = "../tm-browser" }
tm-computer = { path = "../tm-computer" }

# Already pulled in transitively via tm-codeintel; used directly here (project.rs's
# `workspace_root_for`, D-003) to find a workspace's git toplevel via `Repository::discover`, and
# by `tm attach`'s assimilation path.
git2 = { workspace = true }

# Already pulled in transitively via several crates (tm-core, tm-events, ...); used directly here
# (project.rs's `global_project_key`, D-003) to derive a stable `$TM_HOME/projects/<key>/`
# directory name from a workspace's canonical path.
blake3 = { workspace = true }

# Already pulled in transitively via tm-core/tm-events; used directly here (project.rs's
# `promote_global`, D-003 Phase 1-C) for the SQLite online backup API (`rusqlite::backup::Backup`)
# that copies a promoted global session's `project.db` without dropping its WAL sidecar.
rusqlite = { workspace = true }

axum = { workspace = true }
tower-http = { workspace = true, features = ["fs"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
crossterm = { workspace = true }
ratatui-core = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
# For the bare-`tm`-launches-the-TUI-on-a-real-tty integration test (tests/tui_launch.rs), which
# needs a real pty the way tm-tui's own `testing::PtyHarness` does — that module is
# `#[cfg(test)]`-gated in tm-tui and unreachable from this crate's own build, so this test writes
# an equivalent helper under tests/support/ instead of importing it. See that module's docs.
portable-pty = { workspace = true }
vt100 = { workspace = true }
