[package]
name = "tm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "tm: the Ticketmaster command-line surface — the interactive coding agent by default, every subcommand the rest of the workspace exposes, --json everywhere."

[[bin]]
name = "tm"
path = "src/main.rs"

[dependencies]
tm-types = { workspace = true }
tm-core = { workspace = true }
tm-events = { workspace = true }
tm-scheduler = { workspace = true }
tm-provider = { workspace = true }
tm-codeintel = { workspace = true }
tm-context = { workspace = true }
tm-docs = { workspace = true }
tm-harness = { workspace = true }
tm-agent = { workspace = true }
tm-genesis = { workspace = true }
tm-mirror = { workspace = true }
tm-server = { workspace = true }
# Not yet promoted to [workspace.dependencies] in the root manifest; pathed directly so this
# crate does not require editing the workspace root.
tm-browser = { path = "../tm-browser" }
tm-computer = { path = "../tm-computer" }

axum = { workspace = true }
tower-http = { workspace = true, features = ["fs"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
