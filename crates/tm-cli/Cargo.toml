[package]
name = "tm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "tm: the Ticketmaster command-line surface — the interactive coding agent by default, every subcommand the rest of the workspace exposes, --json everywhere."

[[bin]]
name = "tm"
path = "src/main.rs"

[dependencies]
tm-types = { workspace = true }
tm-core = { workspace = true }
tm-events = { workspace = true }
tm-auth = { workspace = true }
tm-acp = { workspace = true }
async-trait = { workspace = true }
tm-scheduler = { workspace = true }
tm-provider = { workspace = true }
tm-codeintel = { workspace = true }
tm-context = { workspace = true }
tm-docs = { workspace = true }
tm-harness = { workspace = true }
tm-agent = { workspace = true }
tm-genesis = { workspace = true }
tm-workflow = { workspace = true }
tm-mirror = { workspace = true }
tm-server = { workspace = true }
tm-tui = { workspace = true }
tm-templates = { workspace = true }
tm-wiki = { workspace = true }
# Not yet promoted to [workspace.dependencies] in the root manifest; pathed directly so this
# crate does not require editing the workspace root.
tm-browser = { path = "../tm-browser" }
tm-computer = { path = "../tm-computer" }
tm-notify = { path = "../tm-notify" }

# Already pulled in transitively via tm-codeintel; used directly here (project.rs's
# `workspace_root_for`, D-003) to find a workspace's git toplevel via `Repository::discover`, and
# by `tm attach`'s assimilation path.
git2 = { workspace = true }

# Already pulled in transitively via several crates (tm-core, tm-events, ...); used directly here
# (project.rs's `global_project_key`, D-003) to derive a stable `$TM_HOME/projects/<key>/`
# directory name from a workspace's canonical path.
blake3 = { workspace = true }

# Already pulled in transitively via tm-core/tm-events; used directly here (project.rs's
# `promote_global`, D-003 Phase 1-C) for the SQLite online backup API (`rusqlite::backup::Backup`)
# that copies a promoted global session's `project.db` without dropping its WAL sidecar.
rusqlite = { workspace = true }

axum = { workspace = true }
tower-http = { workspace = true, features = ["fs"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
dotenvy = { workspace = true }
crossterm = { workspace = true }
ratatui-core = { workspace = true }

# Behind the `otel` feature only (D-010: OpenTelemetry tracing export) -- not workspace deps
# since nothing else in the tree touches OpenTelemetry. Pinned to the mutually-compatible line as
# of 2026-09-20: tracing-opentelemetry 0.33.x depends on opentelemetry ^0.32 (its own 0.33 line
# pairs with the *next* tracing-opentelemetry release, not yet out), so opentelemetry/
# opentelemetry_sdk/opentelemetry-otlp are held to 0.32 deliberately -- bumping any one of the
# four without checking the others' declared requirements will fail to resolve or silently pull
# two incompatible major lines. `default-features = false` on all four to keep the opt-in build
# itself lean: skips otel's metrics/logs support and tracing-opentelemetry's log-bridge, since
# `install_tracing` only ever asks for traces.
opentelemetry = { version = "0.32", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
  "trace",
  "http-proto",
  "reqwest-blocking-client",
], optional = true }
tracing-opentelemetry = { version = "0.33", default-features = false, optional = true }

[features]
default = []
# OpenTelemetry span export (D-010), off by default: `install_tracing` only adds the OTLP layer
# when this feature is compiled in AND `TM_OTEL_ENDPOINT` is set at runtime. Enable with
# `cargo build -p tm-cli --features otel`.
otel = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:tracing-opentelemetry",
]

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
serial_test = { workspace = true }
# For the bare-`tm`-launches-the-TUI-on-a-real-tty integration test (tests/tui_launch.rs), which
# needs a real pty the way tm-tui's own `testing::PtyHarness` does — that module is
# `#[cfg(test)]`-gated in tm-tui and unreachable from this crate's own build, so this test writes
# an equivalent helper under tests/support/ instead of importing it. See that module's docs.
portable-pty = { workspace = true }
vt100 = { workspace = true }
