[package]
name = "tm-codeintel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local-first code intelligence for Ticketmaster: semantic, exact, symbol-aware and git-history retrieval fused over a single SQLite index."

[dependencies]
tm-types = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
git2 = { workspace = true }
blake3 = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
dirs = { workspace = true }
# Pure-Rust, CPU-only static-embedding inference (MinishLab's `model2vec-rs`, D-025). Default
# features off: the crate's default `onig` feature pulls in Oniguruma, a C regex engine, which
# would break this crate's "pure Rust" embedder story; `fancy-regex` is model2vec-rs's
# pure-Rust alternative to it. `hf-hub` is kept for loading from (and, when explicitly
# requested, downloading into) the local HuggingFace cache -- see `crate::potion`.
model2vec-rs = { version = "0.3", default-features = false, features = ["hf-hub", "fancy-regex"] }

[dev-dependencies]
tempfile = { workspace = true }
# Parses fixtures/nav_eval.toml for the `nav_quality_eval` integration test (critic-nav-quality-
# eval); not needed by the library itself.
toml = { workspace = true }
