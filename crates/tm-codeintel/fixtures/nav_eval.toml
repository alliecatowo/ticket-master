//! Sends a periodic heartbeat ping over an open websocket connection and reconnects
//! automatically if too many heartbeats go unanswered by a pong.

/// Send a heartbeat ping over the given websocket connection.
pub fn send_heartbeat_ping(connection: &mut WebsocketConnection) {
    connection.send_frame(Frame::Ping)
}

/// Reconnect the websocket connection after missing consecutive heartbeat pongs.
pub fn reconnect_after_missed_heartbeats(connection: &mut WebsocketConnection) {
    connection.reopen()
}
"""

