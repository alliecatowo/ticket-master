//! Checks whether a role has permission to access a protected resource, consulting the
//! role-based access control grants configured for the current project.

/// Check whether a role has permission to access a given resource.
pub fn role_has_permission_for_resource(role: &str, resource: &str) -> bool {
    lookup_grant(role, resource).is_some()
}

/// Grant a role permission to access a resource, or deny it if `allow` is false.
pub fn grant_or_deny_resource_permission(role: &str, resource: &str, allow: bool) {
    if allow {
        insert_grant(role, resource)
    } else {
        remove_grant(role, resource)
    }
}
"""

