path = "search_index.rs"
content = """
//! Builds an inverted index over a document corpus: tokenizing each document and recording
//! which documents contain which term, the same structure a lexical search signal reads.

/// Tokenize a document's text and merge its tokens into the inverted index.
pub fn tokenize_document_into_inverted_index(document_text: &str, doc_id: u64) {
    merge_tokens(tokenize(document_text), doc_id)
}

/// Look up which documents in the corpus contain a given term.
pub fn lookup_term_in_corpus(term: &str) -> Vec<u64> {
    inverted_index_lookup(term)
}
"""

[[file]]
path = "scheduler.rs"
content = """
//! Retries a failed background job using exponential backoff, capping the delay so a queue
//! of pending attempts does not retry forever against a persistently failing dependency.

/// Compute the exponential backoff delay before the next retry attempt.
pub fn exponential_backoff_delay(attempt: u32, base_seconds: u32) -> u32 {
    base_seconds.saturating_mul(2u32.saturating_pow(attempt))
}

/// Retry a failed job, re-enqueuing it with an exponential backoff delay.
pub fn retry_failed_job_with_backoff(job_id: u64, attempt: u32) {
    requeue(job_id, exponential_backoff_delay(attempt, 1))
}
"""

[[file]]
path = "cache.rs"
content = """
//! Evicts the least recently used entry from an in-memory cache once it exceeds its
//! configured capacity, and invalidates a single entry directly when its source changes.

/// Evict the least recently used cache entry to make room for a new one.
pub fn evict_least_recently_used_entry(cache: &mut CacheState) {
    remove_lru_entry(cache)
}

/// Invalidate a single cache entry by key, without evicting anything else.
pub fn invalidate_cache_entry(cache: &mut CacheState, key: &str) {
    remove_entry(cache, key)
}
"""

