content = """
//! Generates invoices for customer subscriptions: computing prorated charges when a plan
//! changes mid-cycle and applying the outstanding balance to the next payment.

/// Build an invoice line for a subscription charge, prorating for a partial billing cycle.
pub fn build_prorated_invoice_charge(subscription_id: u64, days_remaining: u32) -> f64 {
    prorate_amount(subscription_id, days_remaining)
}

/// Capture a payment against a customer's invoice using the stored payment method.
pub fn capture_invoice_payment(customer_id: u64, invoice_id: u64) -> bool {
    charge_customer(customer_id, invoice_id)
}
"""

