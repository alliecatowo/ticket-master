content = """
//! Formats a structured log message with a severity level, so log output is machine
//! parseable instead of free-form text glued together with format strings.

/// Format a structured log message with the given severity level.
pub fn format_structured_log_message(severity_level: &str, message: &str) -> String {
    format!("level={severity_level} msg={message}")
}

/// Emit a structured log line at the given severity level to the configured sink.
pub fn emit_structured_log(severity_level: &str, message: &str) {
    write_to_sink(format_structured_log_message(severity_level, message))
}
"""

[[file]]
path = "rate_limiter.rs"
content = """
//! Throttles incoming requests using a permit bucket: each request consumes one permit from
//! the bucket, which refills at a steady rate up to its configured burst capacity.

/// Try to consume one permit from the bucket for an incoming request, throttling it if empty.
pub fn throttle_request_with_permit_bucket(bucket: &mut PermitBucket) -> bool {
    bucket.try_consume_permit()
}

/// Refill the permit bucket at its configured steady rate, capped at burst capacity.
pub fn refill_permit_bucket(bucket: &mut PermitBucket, elapsed_seconds: f64) {
    bucket.add_permits(elapsed_seconds)
}
"""

[[file]]
path = "file_storage.rs"
content = """
//! Uploads a file to blob storage and computes a checksum so a later read can detect silent
//! corruption instead of trusting the bytes it gets back unchecked.

/// Upload a file's bytes to blob storage, tagging the object with a checksum digest.
pub fn upload_file_to_blob_storage(bytes: &[u8]) -> String {
    let digest = checksum_digest(bytes);
    put_object(bytes, &digest)
}

/// Confirm a downloaded blob's bytes match its recorded checksum digest.
pub fn confirm_blob_checksum(bytes: &[u8], expected_digest: &str) -> bool {
    checksum_digest(bytes) == expected_digest
}
"""

[[file]]
path = "metrics.rs"
content = """
//! Records histogram metrics for request latency and exposes percentile telemetry so a
//! dashboard can show p50/p95/p99 without recomputing raw samples on every read.

/// Record one latency sample into the request-latency histogram metric.
pub fn record_latency_histogram_sample(latency_ms: f64) {
    histogram_observe("request_latency", latency_ms)
}

/// Compute a percentile from the request-latency histogram's telemetry samples.
pub fn latency_histogram_percentile(percentile: f64) -> f64 {
    histogram_quantile("request_latency", percentile)
}
"""

