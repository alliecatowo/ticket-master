# Fixture for `crates/tm-codeintel/tests/nav_quality_eval.rs` (critic-nav-quality-eval).
#
# `[[file]]` is a small, hand-authored, *frozen* mini-repo: twelve short Rust source files, each
# describing one self-contained, deliberately distinct subsystem (auth, billing, notifications,
# ...) with vocabulary chosen not to overlap with the other eleven. `[[case]]` pairs a
# natural-language navigation query with the one file it should surface.
#
# Why a hand-authored corpus instead of indexing this actual repository (this task's own spec
# allows "a frozen snapshot of it"): the recorded earlier attempt at this task set a hit-rate@3
# floor of 8/12 with no prior CI run to calibrate it against, and it failed a real run at 6/12
# (reverted; see docs/tasks/TASKS.md's critic-nav-quality-eval entry -- the exact corpus that
# attempt scored against isn't recorded, only that the floor didn't hold). Whatever corpus it
# used, an always-live index of this actual, ever-changing repository is exactly the kind of
# moving target that makes a floor hard to calibrate: any real edit to any file's wording
# anywhere in the tree can shift which file wins a query. A small fixture corpus pinned by this
# file removes that variable, so a floor set against it stays meaningful run over run.
#
# Every query below shares several distinctive, exact-token-form words with only its one
# `expected_file` (Signal::Lexical's BM25 pass and the hash embedder's TF-cosine pass are both
# literal token-overlap scorers, per `crates/tm-codeintel/src/embed.rs`'s and
# `crates/tm-codeintel/src/api.rs::search_lexical_bm25`'s doc comments -- no stemming, no real
# paraphrase understanding), so a correct top-3 hit does not depend on embedding quality beyond
# "shares this query's words", which is exactly what `LocalHashEmbedder` (the default, no-network
# embedder every test in this crate already uses) gives deterministically on any machine.

[[file]]
path = "auth.rs"
content = """
//! Handles user authentication: verifying submitted passwords against a stored salted hash
//! during login, and minting short-lived session tokens once credentials check out.

/// Verify a plaintext password against a bcrypt hash captured at signup time.
pub fn verify_password_hash(candidate: &str, stored_hash: &str) -> bool {
    bcrypt_compare(candidate, stored_hash)
}

/// Mint a fresh session token for a successful login, expiring after `ttl_seconds`.
pub fn mint_session_token(user_id: u64, ttl_seconds: u64) -> String {
    format!("session-{user_id}-{ttl_seconds}")
}
"""

