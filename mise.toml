[tools]
go = "latest"
node = "latest"
pnpm = "latest"
rust = "latest"
rust-analyzer = "latest"
uv = "latest"
# The binaries the LSP/zvec-grep Claude Code plugins need on $PATH (CLAUDE.md's "Code
# intelligence" and "Codebase search" sections) -- declared here, not just installed by hand once,
# so `mise install` in a fresh clone or worktree actually provides them instead of silently
# leaving those plugins broken. `sourcekit-lsp` (Swift) isn't listed: it ships with the Xcode
# toolchain, not a package manager mise can drive.
"npm:typescript-language-server" = "latest"
"npm:typescript" = "latest"
"npm:@zvec/zvec-grep" = "latest"

# Every worktree under `.claude/worktrees/` is a full separate git checkout, so without this,
# every one of them would build its own independent `target/` from scratch -- `target/` is
# already ~11GB in the primary checkout alone, and this machine has ~32GB free, so two or three
# worktrees doing a real build at once would be a genuine disk-space incident, not a hypothetical
# one. Pinning one absolute `CARGO_TARGET_DIR` makes every worktree share the primary checkout's
# `target/` instead: third-party dependency artifacts (the bulk of it) are reused as-is, and only
# this workspace's own crates rebuild per worktree's checked-out source. Cargo's own locking
# serializes concurrent access safely; it does not corrupt the shared dir, only makes two
# simultaneous heavy builds wait on each other -- consistent with this file's existing `-j 2` /
# "don't dispatch more than ~2 concurrent heavy builds" guidance. Hardcoded to this machine's
# real path rather than computed, since this repo has no `origin` remote and no other known
# collaborator or machine to be portable for; revisit if that ever changes.
[env]
CARGO_TARGET_DIR = "/Users/allie/Develop/ticket-master/target"

# Every task here is the canonical way to do this thing in this repo. Use `mise run <task>`
# instead of hand-rolling the equivalent `cargo`/`rm` invocation, so build flags (job caps on
# this machine, hygiene, -p scoping) never drift between people and sessions working here.

[tasks.build]
description = "Build the tm binary only (fast default for a quick compile check)"
run = "cargo build -p tm-cli -j 2"

[tasks."build:all"]
description = "Build the entire workspace"
run = "cargo build --workspace -j 2"

[tasks.test]
description = "Run the whole workspace test suite"
run = "cargo test --workspace -j 2"

[tasks."test:crate"]
description = "Run one crate's tests: mise run test:crate -- tm-core"
run = "cargo test -j 2 -p {{arg(name='crate')}}"

[tasks."test:otel"]
description = "Compile + lint + test tm-cli's opt-in OpenTelemetry export path (D-010, --features otel). NOT part of verify -- see that task's note for why -- so run this by hand after touching crates/tm-cli/src/otel.rs, main.rs's install_tracing, or the otel Cargo feature's dependency pins."
run = "cargo clippy -p tm-cli --all-targets --features otel -j 2 -- -D warnings && cargo test -p tm-cli --features otel -j 2"

[tasks."test:live-codex-auth"]
description = "Drive a real AgentLoop turn against the real, already-logged-in Codex CLI's ChatGPT-subscription backend (D-016, --features live-codex-auth). Requires a real `codex login` session on this machine; hits the real network. NOT part of verify -- see D-016 for why -- run this by hand to prove the auth-adapter/provider chain still works against the live backend."
run = "TM_LIVE_CODEX_AUTH=1 cargo test -p tm-agent --features live-codex-auth -j 2 -- --ignored --nocapture live_codex_auth"

[tasks.clippy]
description = "Lint the whole workspace with warnings denied, matching CI"
run = "cargo clippy --workspace --all-targets -j 2 -- -D warnings"

[tasks.fmt]
description = "Apply rustfmt across the workspace (xtask fmt)"
run = "cargo run -p xtask -- fmt"

[tasks.hygiene]
description = "Run the xtask hygiene scan alone (fast; catches non-determinism, unwrap/expect, network-in-tests, stray .tm literals, dangling docs/decisions/D-NNN-*.md cross-references)"
run = "cargo run -p xtask -- hygiene"

[tasks.verify]
description = "The full gate: fmt check + clippy -D warnings + cargo test --workspace + hygiene. Run this before considering any change done."
run = "cargo run -p xtask -- verify"

[tasks."check-drift"]
description = "Advisory post-merge triage (NOT part of verify): flags an unchanged `assert_eq!(Enum::X.len(), N)`-shaped line whose enum gained/lost variants since --base in the same file. Run by hand right after merging parallel tracks: mise run check-drift -- <sha the merged tracks branched from>. See crates/xtask/src/drift.rs's module docs for exactly what it does and does not catch."
run = "cargo run -p xtask -- check-drift --base {{arg(name='base')}}"

[tasks.clean]
description = "Delete target/ to reclaim disk (this machine has real disk pressure; do this after a verify pass, not mid-build)"
run = "rm -rf target"

[tasks.tui]
description = "Build and launch the ratatui TUI against the current directory's project"
run = "cargo run -p tm-cli --bin tm"

[tasks.doctor]
description = "Run tm doctor against the current directory"
run = "cargo run -p tm-cli --bin tm -- doctor"

[tasks."docs:wiki"]
description = "Regenerate docs/wiki/ (SPEC.md §26, B-14) from live project state; add -- --dry-run to preview without writing"
run = "cargo run -p tm-cli --bin tm -- wiki generate"

[tasks.dev]
description = "Build + run the TUI with debug logging to stderr (RUST_LOG=tm=debug)"
run = "RUST_LOG=tm=debug,tm_core=debug,tm_agent=debug cargo run -p tm-cli --bin tm 2> /tmp/tm-dev.log"

[tasks.lsp]
description = "Full-workspace rust-analyzer diagnostics dump (informational, not a gate -- it exits non-zero on ANY diagnostic including benign #[cfg(test)] inactive-code notes; read the output, don't trust the exit code)"
run = "rust-analyzer diagnostics . || true"

[tasks."worktree:clean"]
description = "Remove every merged worktree under .claude/worktrees/ and prune"
run = """
for wt in .claude/worktrees/*/; do
  git worktree remove --force "$wt" 2>/dev/null || true
done
git worktree prune
"""
