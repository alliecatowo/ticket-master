<!doctype html>
<html lang="{{ config.default_language }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ config.title }} &middot; chat now, ticket the rest{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}" />
  <script>
    (function () {
      var d = document.documentElement, t = null;
      d.className += ' js';
      try { t = localStorage.getItem('tm-theme'); } catch (e) {}
      if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;700&display=swap" />
  <meta name="theme-color" content="#282a36" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#efe5cb" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/svg+xml" href="{{ get_url(path='img/favicon.svg', trailing_slash=false) }}" />
  <link rel="stylesheet" href="{{ get_url(path='style.css', trailing_slash=false) }}" />
  {% block head %}{% endblock %}
  <meta property="og:title" content="{% block og_title %}{{ config.title }}{% endblock %}" />
  <meta property="og:description" content="{{ config.description }}" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="{{ get_url(path='img/og.png', trailing_slash=false) }}" />
</head>
<body>
  {% include "partials/nav.html" %}
  {% block content %}{% endblock %}
  {% include "partials/footer.html" %}
  <script>
    (function () {
      var d = document.documentElement;
      function effective() {
        var a = d.getAttribute('data-theme');
        if (a) return a;
        return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      function label() {
        var b = document.querySelectorAll('.theme-btn .lbl');
        for (var i = 0; i < b.length; i++) b[i].textContent = effective() === 'light' ? 'Paper' : 'Ink';
      }
      label();
      document.querySelectorAll('.theme-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var next = effective() === 'light' ? 'dark' : 'light';
          d.setAttribute('data-theme', next);
          try { localStorage.setItem('tm-theme', next); } catch (e) {}
          label();
        });
      });
      var nb = document.querySelector('.nav-btn'), nl = document.getElementById('nav-links');
      if (nb && nl) nb.addEventListener('click', function () {
        var open = nl.classList.toggle('open');
        nb.setAttribute('aria-expanded', open ? 'true' : 'false');
        nb.textContent = open ? 'Close' : 'Menu';
      });
      var dt = document.querySelector('.docs-toggle');
      if (dt) dt.addEventListener('click', function () {
        var sb = dt.parentNode, open = sb.classList.toggle('open');
        dt.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      document.querySelectorAll('[data-copy]').forEach(function (b) {
        b.addEventListener('click', function () {
          var txt = b.getAttribute('data-copy');
          var done = function () { var o = b.textContent; b.textContent = 'copied'; setTimeout(function () { b.textContent = o; }, 1400); };
          if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, function () {}); 
        });
      });
    })();
  </script>
</body>
</html>
