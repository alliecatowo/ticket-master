<!doctype html>
<html lang="{{ config.default_language }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ config.title }} &middot; ticket-powered coding agent{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}" />
  <link rel="icon" type="image/svg+xml" href="{{ get_url(path='img/favicon.svg', trailing_slash=false) }}" />
  <link rel="stylesheet" href="{{ get_url(path='style.css', trailing_slash=false) }}" />
  <link rel="stylesheet" href="{{ get_url(path='giallo-dark.css', trailing_slash=false) }}" media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="{{ get_url(path='giallo-light.css', trailing_slash=false) }}" media="(prefers-color-scheme: light)" />
  <meta property="og:title" content="{% block og_title %}{{ config.title }}{% endblock %}" />
  <meta property="og:description" content="{{ config.description }}" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="{{ get_url(path='img/web-tickets.png', trailing_slash=false) }}" />
</head>
<body>
  {% include "partials/nav.html" %}
  {% block content %}{% endblock %}
  {% include "partials/footer.html" %}
</body>
</html>
