# Commands that prove this scaffold actually works, run through tm-templates' `verify::run`
# (which itself runs through `tm_context::command::run`). `--offline` is deliberate: applying
# and verifying a template must never require network access.

[[check]]
name = "build"
argv = ["cargo", "build", "--offline", "-j", "2"]
env_allowlist = ["PATH", "HOME", "CARGO_HOME", "RUSTUP_HOME", "TMPDIR"]

[[check]]
name = "test"
argv = ["cargo", "test", "--offline", "-j", "2"]
env_allowlist = ["PATH", "HOME", "CARGO_HOME", "RUSTUP_HOME", "TMPDIR"]
