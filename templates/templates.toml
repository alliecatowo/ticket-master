# The Ticketmaster template registry (SPEC.md §27.4): every template available to `tm templates
# list`/`tm templates show` and to `tm-genesis`'s capability-tag selection, pinned by version and
# a blake3 checksum of the template's actual contents so a template can't silently drift out from
# under a project that depends on it. `path` sources are resolved relative to this file's own
# directory. `git`/`registry` source kinds exist in the schema (see `crates/tm-templates`'s
# `TemplateSource`) for SPEC.md §27.4's future community-template story but are not fetchable
# yet — every entry below is `path`, pointing at this repo's own in-repo starter fixtures.
#
# A checksum pin here is regenerated by loading the template with `tm_templates::manifest::
# checksum_dir` and copying its output; `crates/tm-templates/tests/starter_templates.rs`'s
# `registry_pins_match_starter_template_contents` test fails the moment these drift apart.

[[template]]
id = "starter-ratatui"
version = "0.1.0"
checksum = "blake3:109355f88cac6b5149ef5738fea65bf343d433d383ff7c7541cadc60814db24e"

[template.source]
kind = "path"
path = "starter/ratatui"

